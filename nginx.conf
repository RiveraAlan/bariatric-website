server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Long-cache the content-hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SEO files — always fresh
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }

    # Don't cache the HTML shell so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — every route serves index.html (React Router handles it)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
